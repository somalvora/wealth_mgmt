[project]
name = "household-wealth-agent"
version = "0.2.0"
description = "Autonomous Personal & Family Wealth Management Agent (CMU Agentic AI capstone)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "numpy-financial>=1.0",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langchain-core>=1.7.4",
    "langchain-ollama>=1.1.0",
    "chromadb>=1.5.9",
    "mcp>=1.30.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-groq>=1.1.3",
    "python-dotenv>=1.2.4",
    "langchain-google-genai>=4.4.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/household_finance", "src/household_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
