[project]
name = "household-wealth-agent"
version = "0.1.0"
description = "Autonomous Personal & Family Wealth Management Agent (CMU Agentic AI capstone)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "numpy-financial>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/household_finance", "src/household_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
